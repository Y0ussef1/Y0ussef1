<style>
  :root{
    --bg:#f4f7fa; --card:#ffffff; --ink:#2b2f36; --muted:#6b7280;
    --line:#e3e8ee; --brand:#1E88C4; --brand-d:#155f8a; --brand-l:#dcecf8;
    --danger:#dc2626; --danger-bg:#fef2f2; --ok:#16a34a; --ok-bg:#f0fdf4;
    --warn:#b45309; --warn-bg:#fffbeb;
    --r1:#1E9BD7; --r2:#6C7BC4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans Arabic",Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none !important}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:18px}
  .logo-img{height:60px;width:auto;display:block;background:#fff;border-radius:10px;padding:4px 9px}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .lang button{border:0;background:transparent;padding:7px 14px;font-weight:700;cursor:pointer;color:var(--muted);font-size:13px}
  .lang button.on{background:var(--brand);color:#fff}
  .demo-banner{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
  label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  input,select,textarea{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
  textarea{min-height:60px;resize:vertical}
  .row{display:flex;gap:12px}
  .row>div{flex:1}
  .rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .room{border:2px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;text-align:center;transition:.12s;background:#fff}
  .room .dot,.tl-name .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-end:6px}
  .room.sel{border-color:var(--brand);background:var(--brand-l)}
  .room .nm{font-weight:800;font-size:15px}
  .room .cap{color:var(--muted);font-size:12px;margin-top:2px}
  .btn{
    width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:var(--brand);
    color:#fff;font-weight:800;font-size:17px;cursor:pointer;transition:.12s;
  }
  .btn:hover{background:var(--brand-d)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--bg)}
  .btn.danger{background:var(--danger)}
  .btn.danger:hover{background:#b91c1c}
  .btns{display:flex;gap:12px}
  .btns .btn{margin-top:16px}
  .linkbtn{border:0;background:none;padding:0;margin-inline-start:6px;color:inherit;font:inherit;font-weight:800;text-decoration:underline;cursor:pointer}
  .msg{border-radius:12px;padding:13px 15px;margin-top:16px;font-weight:600;font-size:14px;display:none}
  .msg.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #bbf7d0;display:block}
  .msg.err{background:var(--danger-bg);color:var(--danger);border:1px solid #fecaca;display:block}
  .msg.info{background:var(--bg);color:var(--ink);border:1px solid var(--line);display:block}
  .sec-title{font-weight:800;font-size:16px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .date-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
  .daychips{display:flex;gap:6px;margin-bottom:6px}
  .daychips .chip{padding:4px 11px;font-size:12px}
  .bk{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .bk:last-child{border-bottom:0}
  .bk .bar{width:5px;align-self:stretch;border-radius:3px;min-height:38px}
  .bk .t{font-weight:800;font-size:15px;white-space:nowrap}
  .bk .who{font-size:13px;color:var(--muted)}
  .bk .rm{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;margin-inline-start:auto;white-space:nowrap}
  .empty{color:var(--muted);text-align:center;padding:22px;font-size:14px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-inline-end:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:10px}
  /* Planning des salles */
  .tl{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fbfcfd}
  .tl-title{font-weight:800;font-size:13px;margin-bottom:2px}
  .tl-hint{color:var(--muted);font-size:12px;margin-bottom:4px}
  .tl-name{font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}
  .tl-room.sel .tl-name{color:var(--ink)}
  .tl-track{position:relative;height:34px;background:#eef2f6;border-radius:8px;cursor:pointer;overflow:hidden;touch-action:manipulation}
  .tl-room.sel .tl-track{box-shadow:inset 0 0 0 2px var(--brand)}
  .tl-tick{position:absolute;top:0;bottom:0;width:1px;background:#dde3ea;pointer-events:none}
  .tl-past{position:absolute;top:0;bottom:0;background:rgba(107,114,128,.14);pointer-events:none}
  .tl-busy{position:absolute;top:0;bottom:0;border-radius:6px;cursor:default}
  .tl-pick{position:absolute;top:3px;bottom:3px;border:2px dashed var(--brand);border-radius:6px;background:rgba(30,136,196,.14);pointer-events:none}
  .tl-pick.bad{border-color:var(--danger);background:rgba(220,38,38,.14)}
  .tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);pointer-events:none}
  .tl-axis{position:relative;height:16px;margin-top:3px;font-size:11px;color:var(--muted)}
  .tl-axis span{position:absolute;top:0;transform:translateX(-50%)}
  [dir=rtl] .tl-axis span{transform:translateX(50%)}
  .tl-info{font-size:12px;color:var(--ink);margin-top:6px}
  .tl-info:empty{display:none}
  .tl-warn{background:var(--warn-bg);color:var(--warn);border:1px solid #fde68a;border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;margin-top:8px}
  .cx-details{background:var(--bg);border-radius:12px;padding:12px 14px;margin:12px 0 4px;font-size:14px}
  .cx-details b{font-size:16px}
  @media(max-width:480px){.row{flex-direction:column;gap:0}.wrap{padding:12px}}
</style>
</head>

/* ============================================================
   DATA LAYER \u2014 auto-detects environment
   - Google Apps Script (deployed): uses google.script.run  \u2192 shared + real calendar
   - Hosted elsewhere (short link): calls the same script via API_URL
   - Opened locally as a file, or with ?demo=1: uses localStorage \u2192 demo mode
   ============================================================ */
var IS_GAS = (typeof google !== "undefined" && google.script && google.script.run);
var QS = IS_GAS ? null : new URLSearchParams(location.search);
var MODE = IS_GAS ? "gas"
  : (API_URL && location.protocol !== "file:" && !QS.get("demo")) ? "api" : "demo";

// Param\u00e8tres de l'URL : inject\u00e9s par Code.gs quand Google sert la page,
// lus directement dans l'adresse sinon.
function param(injected, name){
  if(injected.indexOf("<?")!==0) return injected;
  return (QS && QS.get(name)) || "";
}
var PRESELECT_ROOM = param("<?= preselect ?>", "room");
var CANCEL_ID = param("<?= cancelId ?>", "cancel");
var CANCEL_TOKEN = param("<?= cancelToken ?>", "t");

function gasCall(fn, args, cb){
  var runner = google.script.run
    .withSuccessHandler(cb)
    .withFailureHandler(function(){ cb({ok:false,error:"errNet"}); });
  runner[fn].apply(runner, args);
}

function apiCall(body, cb){
  // text/plain : requ\u00eate \u00ab simple \u00bb, sans pr\u00e9-v\u00e9rification CORS
  fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(body)})
    .then(function(r){ return r.json(); })
    .then(cb, function(){ cb({ok:false,error:"errNet"}); });
}

function demoItems(){ return JSON.parse(localStorage.getItem("demo_bookings")||"[]"); }
function demoSave(items){ localStorage.setItem("demo_bookings",JSON.stringify(items)); }
function demoFind(id,token){ return demoItems().filter(function(b){ return String(b.id)===id && b.token===token; })[0]; }
function demoOver(b){ return new Date(b.date+"T"+b.end) < new Date(); }
function later(cb,res){ setTimeout(function(){ cb(res); },300); }

var DataStore = {
  // cb(items) \u2014 items = null si le chargement a \u00e9chou\u00e9
  list:function(cb){
    if(MODE==="gas") gasCall("getBookings",[],function(r){ cb(Array.isArray(r)?r:null); });
    else if(MODE==="api") apiCall({action:"list"},function(r){ cb(r.ok?r.items:null); });
    else cb(demoItems().filter(function(b){ return !b.cancelled; }));
  },
  create:function(p,cb){
    if(MODE==="gas") return gasCall("createBooking",[p],cb);
    if(MODE==="api") return apiCall({action:"create",booking:p},cb);
    // Demo mode: check overlap locally
    var items=demoItems();
    var clash=items.some(function(b){
      return !b.cancelled && b.room===p.room && b.date===p.date && !(p.end<=b.start || p.start>=b.end);
    });
    if(clash) return later(cb,{ok:false,error:"errClash"});
    p.id=String(Date.now()); p.token=Math.random().toString(16).slice(2); items.push(p);
    demoSave(items);
    later(cb,{ok:true,id:p.id,token:p.token});
  },
  cancelInfo:function(id,token,cb){
    if(MODE==="gas") return gasCall("getCancelInfo",[id,token],cb);
    if(MODE==="api") return apiCall({action:"cancelInfo",id:id,token:token},cb);
    var b=demoFind(id,token);
    later(cb, b ? {ok:true,booking:b,cancelled:!!b.cancelled,past:demoOver(b)} : {ok:false,error:"cInvalid"});
  },
  cancel:function(id,token,cb){
    if(MODE==="gas") return gasCall("cancelBooking",[id,token],cb);
    if(MODE==="api") return apiCall({action:"cancel",id:id,token:token},cb);
    var b=demoFind(id,token);
    if(!b) return later(cb,{ok:false,error:"cInvalid"});
    if(b.cancelled) return later(cb,{ok:true,already:true});
    if(demoOver(b)) return later(cb,{ok:false,error:"cPast"});
    demoSave(demoItems().map(function(x){ if(String(x.id)===id) x.cancelled=true; return x; }));
    later(cb,{ok:true});
  }
};

    c.appendChild(d);

function renderFilters(){

  var c=document.getElementById("filters"); c.innerHTML="";
  defs.forEach(function(d){
    var b=document.createElement("button");
    b.className="chip"+(filter===d[0]?" on":"");
    b.textContent=t(d[1]);
    b.onclick=function(){ filter=d[0]; renderFilters(); renderList(); };
    c.appendChild(b);
  });
}

function pad(n){return (n<10?"0":"")+n;}
function ymd(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());}
function toMin(hm){ var p=hm.split(":"); return parseInt(p[0],10)*60+parseInt(p[1],10); }
function toHM(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
function dayOffset(n){ var d=new Date(); d.setDate(d.getDate()+n); return ymd(d); }

function inFilter(b){
  var today=new Date(); today.setHours(0,0,0,0);
  var d=new Date(b.date+"T00:00:00");
  if(filter==="all") return d>=today;
  if(filter==="past") return d<today;
  if(filter==="today") return b.date===ymd(today);
  if(filter==="tomorrow"){var tm=new Date(today);tm.setDate(tm.getDate()+1);return b.date===ymd(tm);}
  if(filter==="week"){var wk=new Date(today);wk.setDate(wk.getDate()+7);return d>=today&&d<wk;}
  return true;
}

function fmtDate(ds){
  var d=new Date(ds+"T00:00:00");
  return d.toLocaleDateString(lang==="ar"?"ar-EG":"en-GB",{weekday:"short",day:"numeric",month:"short"});
}

function renderList(){
  var list=document.getElementById("list");
  if(allBookings===null){
    list.innerHTML='<div class="empty">'+t(listFailed?"errNet":"loading")+'</div>'; return;
  }
  var items=allBookings.filter(inFilter).sort(function(a,b){
    var cmp=(a.date+a.start).localeCompare(b.date+b.start);
    return filter==="past" ? -cmp : cmp; // pass\u00e9es: plus r\u00e9cente en premier
  });
  if(!items.length){ list.innerHTML='<div class="empty">'+t("empty")+'</div>'; return; }
  list.innerHTML="";
  items.forEach(function(b){
    var r=roomById(b.room)||{color:"#999"};
    var el=document.createElement("div"); el.className="bk";
    el.innerHTML=
      '<div class="bar" style="background:'+r.color+'"></div>'+
      '<div><div class="t">'+b.start+' \u2013 '+b.end+'</div>'+
      '<div class="who">'+fmtDate(b.date)+' \u00b7 <bdi>'+escapeHtml(b.name)+'</bdi>'+(b.purpose?' \u00b7 <bdi>'+escapeHtml(b.purpose)+'</bdi>':'')+'</div></div>'+
      '<span class="rm" style="background:'+r.color+'22;color:'+r.color+'">'+(r.nameEn?roomName(r):escapeHtml(b.room))+'</span>';
    list.appendChild(el);
  });
}

    var b=document.createElement("button");

    b.type="button"; b.className="chip"+(cur===day?" on":""); b.textContent=t(d[0]);
    b.onclick=function(){ document.getElementById("fDate").value=day; onDateTimeChange(); };
    c.appendChild(b);

function dayBookings(date, roomId){
  return (allBookings||[]).filter(function(b){ return b.date===date && b.room===roomId; });
}

// Position (en %) d'une heure "HH:mm" sur la barre de la journ\u00e9e.
function pct(min){
  var a=DAY_START*60, z=DAY_END*60;
  return Math.max(0, Math.min(100, (min-a)*100/(z-a)));
}

  var date=document.getElementById("fDate").value;
  var start=document.getElementById("fStart").value, end=document.getElementById("fEnd").value;

  var today=ymd(new Date()), now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  box.innerHTML="";
  var clash=false;

  ROOMS.forEach(function(r){
    var wrap=document.createElement("div");
    wrap.className="tl-room"+(r.id===selectedRoom?" sel":"");
    var name=document.createElement("div"); name.className="tl-name";
    name.innerHTML='<span class="dot" style="background:'+r.color+'"></span>'+roomName(r);
    var track=document.createElement("div"); track.className="tl-track";
    track.setAttribute("role","button");

    for(var h=DAY_START+1; h<DAY_END; h++){
      var tick=document.createElement("div"); tick.className="tl-tick";
      tick.style[side]=pct(h*60)+"%"; track.appendChild(tick);
    }
    if(date===today){
      var past=document.createElement("div"); past.className="tl-past";
      past.style[side]="0%"; past.style.width=pct(nowMin)+"%"; track.appendChild(past);
    }
    var busy=dayBookings(date, r.id);
    busy.forEach(function(b){
      var s=toMin(b.start), e=toMin(b.end);
      if(e<=DAY_START*60 || s>=DAY_END*60) return;
      var el=document.createElement("div"); el.className="tl-busy";
      el.style[side]=pct(s)+"%"; el.style.width=(pct(e)-pct(s))+"%"; el.style.background=r.color;
      var label=b.start+" \u2013 "+b.end+" \u00b7 "+b.name+(b.purpose?" \u00b7 "+b.purpose:"");
      el.title=label; el.setAttribute("aria-label",label);
      el.onclick=function(ev){ ev.stopPropagation(); document.getElementById("tlInfo").textContent=roomName(r)+" \u00b7 "+label; };
      track.appendChild(el);
    });
    if(r.id===selectedRoom && start && end && end>start){
      var bad=busy.some(function(b){ return !(end<=b.start || start>=b.end); });
      clash=bad;
      var pk=document.createElement("div"); pk.className="tl-pick"+(bad?" bad":"");
      pk.style[side]=pct(toMin(start))+"%"; pk.style.width=Math.max(1,pct(toMin(end))-pct(toMin(start)))+"%";
      track.appendChild(pk);
    }
    if(date===today && nowMin>DAY_START*60 && nowMin<DAY_END*60){
      var nl=document.createElement("div"); nl.className="tl-now";
      nl.style[side]=pct(nowMin)+"%"; track.appendChild(nl);
    }
    track.onclick=function(ev){ pickSlot(r.id, track, ev); };
    wrap.appendChild(name); wrap.appendChild(track);
    box.appendChild(wrap);
  });

  var axis=document.createElement("div"); axis.className="tl-axis";
  for(var h2=DAY_START; h2<=DAY_END; h2+=2){
    var lb=document.createElement("span"); lb.textContent=h2;
    lb.style[side]=pct(h2*60)+"%"; axis.appendChild(lb);
  }
  box.appendChild(axis);
  document.getElementById("tlWarn").hidden=!clash;
}

// Clic sur une zone libre : choisit la salle et remplit les heures
// (1 h, ou jusqu'\u00e0 la r\u00e9servation suivante si elle commence avant).
function pickSlot(roomId, track, ev){
  var rect=track.getBoundingClientRect();
  var frac=(lang==="ar") ? (rect.right-ev.clientX)/rect.width : (ev.clientX-rect.left)/rect.width;
  var a=DAY_START*60, z=DAY_END*60;
  var m=Math.floor((a+frac*(z-a))/30)*30;
  var date=document.getElementById("fDate").value;
  if(date===ymd(new Date())){
    var n=new Date(), nowMin=n.getHours()*60+n.getMinutes();
    if(m<nowMin) m=Math.ceil(nowMin/15)*15;
  }
  var busy=dayBookings(date, roomId);
  var inside=busy.some(function(b){ return m>=toMin(b.start) && m<toMin(b.end); });
  if(inside || m>=z) return;
  var e=Math.min(m+60, z);
  busy.forEach(function(b){ var s=toMin(b.start); if(s>m && s<e) e=s; });
  selectedRoom=roomId;
  document.getElementById("fStart").value=toHM(m);
  document.getElementById("fEnd").value=toHM(e);
  document.getElementById("tlInfo").textContent="";
  renderRooms(); renderTimeline();
}

function onDateTimeChange(){ document.getElementById("tlInfo").textContent=""; renderDayChips(); renderTimeline(); }

function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

function showMsg(text,ok,undo){
  var m=document.getElementById("msg");
  m.className="msg "+(ok?"ok":"err"); m.textContent=text;
  if(undo){
    var b=document.createElement("button"); b.className="linkbtn"; b.textContent=t("undo");
    b.onclick=undoLast; m.appendChild(b);
  }
  m.scrollIntoView({behavior:"smooth",block:"center"});
}

function validEmail(e){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}

function submitBooking(){
  var name=document.getElementById("fName").value.trim();
  var email=document.getElementById("fEmail").value.trim();
  var date=document.getElementById("fDate").value;
  var start=document.getElementById("fStart").value;
  var end=document.getElementById("fEnd").value;
  var purpose=document.getElementById("fPurpose").value.trim();

  if(!selectedRoom) return showMsg(t("errRoom"),false);
  if(!name||!email||!date||!start||!end) return showMsg(t("errFields"),false);
  if(!validEmail(email)) return showMsg(t("errEmail"),false);
  if(end<=start) return showMsg(t("errTime"),false);
  var startDt=new Date(date+"T"+start);
  if(startDt < new Date(Date.now()-60000)) return showMsg(t("errPast"),false);

  var payload={name:name,email:email,room:selectedRoom,date:date,start:start,end:end,purpose:purpose};
  var btn=document.getElementById("submitBtn");
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>'+t("sending");

  DataStore.create(payload,function(res){
    btn.disabled=false; btn.textContent=t("submit");
    if(res.ok){
      lastBooking = res.token ? {id:String(res.id), token:res.token} : null;
      showMsg(t("okMsg"),true,!!lastBooking);
      document.getElementById("fName").value="";
      document.getElementById("fPurpose").value="";
      loadBookings();
    }else{
      showMsg(t(res.error)||res.message||t("errNet"),false);
    }
  });
}

// Bouton \u00ab Annuler ce cr\u00e9neau \u00bb juste apr\u00e8s une r\u00e9servation.
function undoLast(){
  if(!lastBooking) return;
  var b=lastBooking;
  DataStore.cancel(b.id,b.token,function(res){
    if(res.ok){ lastBooking=null; showMsg(t("cDone"),true); loadBookings(); }
    else showMsg(t(res.error),false);
  });
}

function loadBookings(){
  DataStore.list(function(items){
    listFailed = (items===null);
    allBookings = items;
    renderList(); renderTimeline();
  });
}

/* ---------- \u00c9cran d'annulation (lien re\u00e7u par email) ---------- */

function openCancel(){
  document.getElementById("cancelCard").hidden=false;
  document.getElementById("formCard").hidden=true;
  cancelState={view:"loading"};
  renderCancel();
  DataStore.cancelInfo(CANCEL_ID, CANCEL_TOKEN, function(res){
    if(!res.ok) cancelState={view:"msg", error:res.error||"errNet"};
    else cancelState={view:res.cancelled?"already":(res.past?"past":"ask"), booking:res.booking};
    renderCancel();
  });
}

function closeCancel(){
  document.getElementById("cancelCard").hidden=true;
  document.getElementById("formCard").hidden=false;
  cancelState=null;
}

function confirmCancel(){
  cancelState.view="working"; renderCancel();
  DataStore.cancel(CANCEL_ID, CANCEL_TOKEN, function(res){
    if(res.ok) cancelState.view=res.already?"already":"done";
    else cancelState={view:"msg", booking:cancelState.booking, error:res.error||"errNet"};
    renderCancel();
    if(res.ok) loadBookings();
  });
}

function renderCancel(){
  var body=document.getElementById("cancelBody");
  if(!cancelState){ body.innerHTML=""; return; }
  var s=cancelState, b=s.booking, h="";
  if(s.view==="loading"){ body.innerHTML='<div class="empty">'+t("loading")+'</div>'; return; }
  if(b){
    var r=roomById(b.room);
    h+='<div class="cx-details"><b>'+(r?roomName(r):escapeHtml(b.room))+'</b><br>'+
       fmtDate(b.date)+' \u00b7 '+escapeHtml(b.start)+' \u2013 '+escapeHtml(b.end)+'<br><bdi>'+escapeHtml(b.name)+'</bdi>'+(b.purpose?' \u00b7 <bdi>'+escapeHtml(b.purpose)+'</bdi>':'')+'</div>';
  }
  var note={ask:"cAsk", working:"cAsk", done:"cDone", already:"cAlready", past:"cPast"}[s.view] || s.error;
  var cls={ask:"info", working:"info", done:"ok", already:"info"}[s.view] || "err";
  h+='<div class="msg '+cls+'">'+escapeHtml(t(note))+'</div>';
  if(s.view==="ask" || s.view==="working"){
    h+='<div class="btns"><button class="btn danger" id="cxYes"'+(s.view==="working"?' disabled':'')+'>'+
       (s.view==="working"?'<span class="spin"></span>'+t("cancelling"):t("cYes"))+'</button>'+
       '<button class="btn ghost" id="cxNo">'+t("cNo")+'</button></div>';
  }else{
    h+='<button class="btn ghost" id="cxNo">'+t("bookRoom")+'</button>';
  }
  body.innerHTML=h;
  var y=document.getElementById("cxYes"); if(y) y.onclick=confirmCancel;
  document.getElementById("cxNo").onclick=closeCancel;
}
